# =====================================================================
# CI básico: lint + tests en cada push y pull request a main.
# Se podría extender con un job de "drift check" que ejecute
# src/monitoring/drift.py y publique el HTML como artefacto.
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt
          pip install -r requirements-serve.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest -q
